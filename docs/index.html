<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Code 90 — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b120f;
    --panel: #121b16;
    --border: #233029;
    --ink: #eef2ee;
    --mute: #8a9690;
    --gold: #d4a441;
    --gold-dim: rgba(212,164,65,0.14);
    --live: #e2574c;
    --live-dim: rgba(226,87,76,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(ellipse 900px 500px at 20% -10%, rgba(212,164,65,0.06), transparent 60%);
    color: var(--ink);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    padding-bottom: 64px;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .topbar {
    position: sticky; top: 0; z-index: 5;
    background: rgba(11,18,15,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px 14px;
  }
  .topbar-inner { max-width: 700px; margin: 0 auto; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 3px;
  }
  h1 { font-size: 1.32rem; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  #meta { color: var(--mute); font-size: 0.78rem; }
  .run-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; letter-spacing: 0.03em;
    color: var(--gold); text-decoration: none;
    border: 1px solid rgba(212,164,65,0.4);
    border-radius: 7px; padding: 6px 11px; white-space: nowrap;
  }
  .run-link:active { background: var(--gold-dim); }

  main {
    max-width: 700px; margin: 0 auto; padding: 18px 16px 0;
    display: flex; flex-direction: column; gap: 14px;
  }
  .day-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 6px 0 -4px; color: var(--mute);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .day-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: relative;
  }
  .card.has-signal { border-color: rgba(212,164,65,0.35); }
  .card.perime { opacity: 0.55; }

  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .match-title { font-weight: 600; font-size: 1.03rem; line-height: 1.25; }
  .comp { color: var(--mute); font-size: 0.78rem; margin-top: 2px; }
  .kickoff { text-align: right; flex-shrink: 0; }
  .kickoff-time { font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; font-weight: 500; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase;
    margin-top: 3px; padding: 2px 7px; border-radius: 999px;
  }
  .status-pill.upcoming { color: var(--mute); background: rgba(138,150,144,0.12); }
  .status-pill.live { color: var(--live); background: var(--live-dim); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-pill.live .status-dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .signal-badge {
    position: absolute; top: 0; right: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.06em; font-weight: 600;
    color: #1a1408; background: var(--gold);
    padding: 4px 10px 4px 12px; border-bottom-left-radius: 10px;
  }

  .bet-block {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .bet-market { font-weight: 500; font-size: 0.95rem; }
  .bet-odds { font-family: 'IBM Plex Mono', monospace; color: var(--mute); margin-left: 6px; }
  .sub-line { font-family: 'IBM Plex Mono', monospace; color: var(--mute); font-size: 0.76rem; margin-top: 4px; }
  .empty { color: var(--mute); font-size: 0.85rem; font-style: italic; margin-top: 12px; }
  .obsolete-note { font-size: 0.8rem; color: var(--mute); font-style: italic; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }

  #status { text-align: center; color: var(--mute); padding: 60px 20px; max-width: 500px; margin: 0 auto; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="eyebrow">Analyse pré-match · Modèle A</div>
    <h1>⚽ Robot Code 90</h1>
    <div class="meta-row">
      <div id="meta">Chargement…</div>
      <a class="run-link" id="run-link" href="#" target="_blank" rel="noopener">↻ Lancer une analyse</a>
    </div>
  </div>
</div>

<main id="content">
  <div id="status">Chargement des résultats…</div>
</main>

<script>
// Renseigne owner/repo une fois (visible dans l'URL de ton dépôt GitHub)
const GITHUB_OWNER = "djabiganpronos";
const GITHUB_REPO = "robot_code90";
document.getElementById("run-link").href =
  `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/run.yml`;

const DUREE_MATCH_MIN = 130;

async function charger() {
  const contenu = document.getElementById("content");
  const meta = document.getElementById("meta");
  try {
    const res = await fetch("data/latest.json?_=" + Date.now());
    if (!res.ok) throw new Error("Fichier de résultats introuvable");
    const data = await res.json();

    const genere = new Date(data.generated_at);
    meta.innerHTML = `Mis à jour <span class="mono">${genere.toLocaleString("fr-FR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})}</span> · ${data.nb_matchs} match(s)`;

    if (data.erreur) {
      contenu.innerHTML = `<div id="status">Erreur lors de la dernière exécution :<br><span class="mono">${escapeHtml(data.erreur)}</span></div>`;
      return;
    }
    if (!data.matchs || data.matchs.length === 0) {
      contenu.innerHTML = `<div id="status">Aucun match exploitable pour le moment.</div>`;
      return;
    }

    let html = "";
    let dernierJour = null;
    const maintenant = new Date();

    const matchsTries = [...data.matchs].sort((m1, m2) => {
      const p1 = statutMatch(m1.commence_time, maintenant).perime ? 1 : 0;
      const p2 = statutMatch(m2.commence_time, maintenant).perime ? 1 : 0;
      if (p1 !== p2) return p1 - p2;
      return (m1.commence_time || "").localeCompare(m2.commence_time || "");
    });

    matchsTries.forEach(m => {
      if (m.commence_time) {
        const jourLabel = libelleJour(new Date(m.commence_time), maintenant);
        if (jourLabel !== dernierJour) {
          html += `<div class="day-divider">${jourLabel}</div>`;
          dernierJour = jourLabel;
        }
      }
      html += renderMatch(m, maintenant);
    });

    contenu.innerHTML = html;
  } catch (e) {
    contenu.innerHTML = `<div id="status">Impossible de charger les résultats (${escapeHtml(e.message)}).<br>Vérifie que le workflow GitHub Actions a bien tourné au moins une fois.</div>`;
  }
}

function libelleJour(date, maintenant) {
  const unJour = 86400000;
  const j1 = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const j0 = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate());
  const diff = Math.round((j1 - j0) / unJour);
  if (diff === 0) return "Aujourd'hui";
  if (diff === 1) return "Demain";
  return date.toLocaleDateString("fr-FR", { weekday: "long", day: "2-digit", month: "2-digit" });
}

function statutMatch(commenceTime, maintenant) {
  if (!commenceTime) return { classe: "upcoming", label: "Horaire inconnu", perime: false };
  const debut = new Date(commenceTime);
  const finEstimee = new Date(debut.getTime() + DUREE_MATCH_MIN * 60000);
  if (maintenant < debut) return { classe: "upcoming", label: "À venir", perime: false };
  if (maintenant < finEstimee) return { classe: "live", label: "En cours (estimé)", perime: true };
  return { classe: "upcoming", label: "Terminé (estimé)", perime: true };
}

function renderMatch(m, maintenant) {
  const heure = m.commence_time
    ? new Date(m.commence_time).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
    : "—";
  const statut = statutMatch(m.commence_time, maintenant);

  if (statut.perime) {
    return `
      <div class="card perime">
        <div class="card-head">
          <div>
            <div class="match-title">${escapeHtml(m.match)}</div>
            <div class="comp">${escapeHtml(m.competition)}</div>
          </div>
          <div class="kickoff">
            <div class="kickoff-time mono">${heure}</div>
            <div class="status-pill ${statut.classe}"><span class="status-dot"></span>${statut.label}</div>
          </div>
        </div>
        <div class="obsolete-note">Coup d'envoi dépassé — analyse pré-match obsolète, non actionnable.</div>
      </div>
    `;
  }

  const aSignal = !!m.modele_a;
  const bet = aSignal
    ? `<div class="bet-block">
         <span class="bet-market">${escapeHtml(m.modele_a.pari)}</span>
         <span class="bet-odds">@ ${m.modele_a.cote}</span>
         <div class="sub-line">indice fixe : ${m.modele_a.indice_fixe}% · ${escapeHtml(m.modele_a.motif || "")}</div>
       </div>`
    : `<div class="empty">Aucun signal sur ce match</div>`;

  const badge = aSignal ? `<div class="signal-badge">🎯 signal</div>` : "";

  return `
    <div class="card ${aSignal ? "has-signal" : ""}">
      ${badge}
      <div class="card-head">
        <div>
          <div class="match-title">${escapeHtml(m.match)}</div>
          <div class="comp">${escapeHtml(m.competition)}</div>
        </div>
        <div class="kickoff">
          <div class="kickoff-time mono">${heure}</div>
          <div class="status-pill ${statut.classe}"><span class="status-dot"></span>${statut.label}</div>
        </div>
      </div>
      ${bet}
    </div>
  `;
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

charger();
</script>

</body>
</html>
